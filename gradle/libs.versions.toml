[versions]
kotlin = "2.4.10"
junit = "6.1.2"
agp = "9.3.0"
libxposed = "102.0.0"
oldxposed = "82"
dokka = "2.2.0"
vanniktechMavenPublish = "0.37.0"
annotationJvm = "1.10.0"

[libraries]
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
libxposedApi = { module = "io.github.libxposed:api", version.ref = "libxposed" }
xposed82Api = { module = "de.robv.android.xposed:api", version.ref = "oldxposed" }
annotation-jvm = { group = "androidx.annotation", name = "annotation-jvm", version.ref = "annotationJvm" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
